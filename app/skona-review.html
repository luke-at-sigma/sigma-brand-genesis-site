/* Layout: a review sheet. A quiet spreadsheet-grid header, then one section per message theme,
   each ad on a gray "card frame" stage with a three-way verdict and a note. Ends on the car. */
:root{
  --bg:#FFFFFF; --panel:#F6F6F7; --stage:#EEEEF0; --line:#E5E5E9; --line-2:#D6D6DB;
  --ink:#111114; --body:#4A4A52; --meta:#6E6E78;
  --brand:#1A70F1; --keep:#1C7A43; --keep-bg:#E3F4EA; --maybe:#8A5A00; --maybe-bg:#FBF0D9; --cut:#A3332A; --cut-bg:#F9E3E0;
  --grid:rgba(17,17,20,.05);
  --display:'Advercase',Georgia,'Times New Roman',serif; --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'DM Mono',ui-monospace,Menlo,monospace;
}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}

.progress{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--meta);font-variant-numeric:tabular-nums}
.btn{font:500 13px/1 var(--sans);padding:8px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);cursor:pointer;white-space:nowrap}

main .wrap{padding-block:12px 64px}
section.theme{padding-top:40px;display:grid;gap:16px}
.th-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}

let show='All';

function sheet(){

    const ads=ADS.filter(a=>a.format===f&&(show==='All'||a.theme===show)).sort((p,q)=>tOrder[p.theme]-tOrder[q.theme]);
    if(!ads.length)return'';
    return `<section class="theme"><div class="th-head"><h2>${esc(t)}</h2><p>${esc(brief)}</p></div><div class="grid">${ads.map(card).join('')}</div></section>`;
  }).join('');
  $$('.ad').forEach(el=>{
    const id=el.dataset.id;
    $$('.v button',el).forEach(b=>b.onclick=()=>{
      mine.marks[id]=mine.marks[id]===b.dataset.v?undefined:b.dataset.v; if(!mine.marks[id])delete mine.marks[id];
      $$('.v button',el).forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===mine.marks[id])));
      progress();save();
    });
    const ta=$('textarea',el);
    const sel=$('[data-app]',el),hdr=$('[data-hdr]',el);
    if(sel){const upd=()=>{mine.apps[id]={app:sel.value,header:hdr.checked};$('.ad-svg',el).innerHTML=adSvg(id);car();save()};sel.onchange=upd;hdr.onchange=upd}

}
function progress(){
  const n=ADS.filter(a=>mine.marks[a.id]).length;

}

/* ---------- copy my notes, for pasting anywhere ---------- */
$('#copy').onclick=()=>{
  const lines=['NYC subway ads, round three: my review',''];
  for(const [f,t] of GROUPS){
    const ads=ADS.filter(a=>a.format===f&&(mine.marks[a.id]||mine.notes[a.id]));
    if(!ads.length)continue; lines.push(t+':');
    ads.forEach(a=>lines.push(`- ${(mine.marks[a.id]||'no mark').toUpperCase()}: ${a.headline}${a.fb?(a.tag?' [new line]':' [rebuilt from feedback]'):''}${TPL[a.id]?' [app: '+APPS.find(x=>x[0]===appFor(a.id).app)[1]+(appFor(a.id).header?', with header':'')+']':''} (${a.theme})${mine.notes[a.id]?' — '+mine.notes[a.id]:''}`));
    lines.push('');
  }
  if(mine.overall)lines.push('Overall: '+mine.overall);
  const text=lines.join('\n');
  const done=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(done.t);done.t=setTimeout(()=>t.classList.remove('on'),1800)};
  try{navigator.clipboard.writeText(text).then(()=>done('Notes copied'),()=>{fallback(text);done('Select and copy the notes below')})}catch(e){fallback(text);done('Select and copy the notes below')}
};
function fallback(text){const ta=$('#overallNote');const prev=ta.value;ta.value=text+(prev?'\n\n'+prev:'');ta.focus();ta.select();}

  const vb=view==='car'?[0,W]:[segs[SEC[view][0]].x+DOOR*.4,segs[SEC[view][1]].x+DOOR*.6];
  $('#car').classList.toggle('sec',view!=='car');
  $('#car').innerHTML=`<svg viewBox="${vb[0]} 0 ${vb[1]-vb[0]} ${H}" width="100%" role="img" aria-label="A subway car wall showing the ads in their card slots">${g.join('')}</svg>`;
  $$('#car .slot').forEach(el=>{const next=()=>{const i=+el.dataset.i,l=poolFor(SLOTS[i].f);const j=l.findIndex(a=>a.id===pick[i]);pick[i]=l[(j+1)%l.length].id;car()};el.onclick=next;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();next()}}});
}
$('#trTheme').innerHTML=['All',...THEMES.map(t=>t[0])].map(t=>`<option value="${esc(t)}">${t==='All'?'All themes':esc(t)}</option>`).join('');
$('#trTheme').onchange=e=>{fillMode=e.target.value;fill(false);car()};
$('#trShuffle').onclick=()=>{fill(true);car()};
$$('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;$$('[data-view]').forEach(x=>x.setAttribute('aria-pressed',x===b));car()});
$('#trKeeps').onclick=()=>{if(!ADS.some(a=>mine.marks[a.id]==='keep')){const t=$('#toast');t.textContent='Mark some ads Keep first';t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800);return}fillMode='keeps';fill(false);car()};

chips();sheet();fill(false);car();
fetch('assets/skona-subway/round3/templates.json?v='+V).then(r=>r.ok?r.json():{}).then(j=>{TPL=j||{};sheet();car()}).catch(()=>{});

/* ---------- shared store: light up when the viewer grants it ---------- */
(async()=>{
  try{
    [db,user]=await Promise.all([window.claude?.use?.('db')??null,window.claude?.use?.('user')??null]);
    if(!db||!user){$('#saveState').textContent='Saved in this browser';return}
    uid=await user.id();
    if(!uid){db=null;$('#saveState').textContent='Saved in this browser';return}
    const w=user.can?await user.can('data.write'):null; if(w===false)canWrite=false;
    const snap=await db.doc('reviews/'+uid).get();
    if(snap.exists){const d=snap.data();const hasLocal=Object.keys(mine.marks).length||Object.keys(mine.notes).length;mine={marks:{...(d.marks||{})},notes:{...(d.notes||{})},overall:d.overall||'',apps:{...(d.apps||{})}};if(hasLocal)save();sheet();$('#overallNote').value=mine.overall}
    else if(Object.keys(mine.marks).length||Object.keys(mine.notes).length)save();
    $('#saveState').textContent=canWrite?'Saved':'View only';
    db.collection('reviews').onSnapshot(async q=>{
      others={};q.docs.forEach(d=>{others[d.id]=d.data()||{}});
      const ids=Object.keys(others).filter(u=>u!==uid);
      if(ids.length){try{const ps=await user.profiles(ids);ids.forEach(i=>names[i]=(ps[i]&&ps[i].name)||'Reviewer')}catch(e){}}
      $$('.ad').forEach(el=>{const o=$('.others',el);if(o)o.innerHTML=othersFor(el.dataset.id)});
    },()=>{});
  }catch(e){$('#saveState').textContent='Saved in this browser'}
})();
})();
</script>
